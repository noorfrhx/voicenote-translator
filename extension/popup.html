<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>VoiceNote Translator</title>
  <style>
    :root { color-scheme: light dark; --green: #1fa855; --orange: #e5932b; --red: #e5484d; --muted: #8889; }
    body { width: 300px; margin: 0; padding: 14px 16px; font: 13px/1.45 system-ui, -apple-system, sans-serif; }
    h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 20px; height: 20px; }
    .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--muted); }
    .row:first-of-type { border-top: 0; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
    .ok .dot { background: var(--green); }
    .warn .dot { background: var(--orange); }
    .label { flex: 1; }
    .value { opacity: 0.75; text-align: right; }
    .problem { margin: 8px 0 0; padding: 8px 10px; border-radius: 6px; background: #e5484d1a; color: var(--red); }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 6px 8px; font: inherit; border: 1px solid var(--muted); border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
    button.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
    .hint { margin-top: 10px; font-size: 12px; opacity: 0.7; }
  </style>
</head>
<body>
  <h1><img src="icons/icon32.png" alt="">VoiceNote Translator</h1>
  <div id="rows"><div class="row"><span class="dot"></span><span class="label">Checking…</span></div></div>
  <div id="problem" class="problem" hidden></div>
  <div class="actions">
    <button id="settings" class="primary">Open app settings</button>
    <button id="reconnect">Reconnect</button>
  </div>
  <p class="hint">Translation runs in the VoiceNote Translator Mac app. This extension only connects WhatsApp Web to it.</p>
  <script src="popup.js"></script>
</body>
</html>
